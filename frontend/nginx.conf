server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must always be revalidated - it's what points the browser at the
    # current hashed JS/CSS filenames, so a cached copy after a deploy can send an
    # old browser to a stale bundle that no longer matches the backend's API shape.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes these filenames, so a changed file always gets a new
    # name - safe to cache for as long as the browser wants.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
